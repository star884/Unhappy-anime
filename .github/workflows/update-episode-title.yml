name: Update Episode Title

on:
  workflow_dispatch:
    inputs:
      series:
        description: Exact series name from data/series.json
        required: true
        type: string

      season:
        description: Season number; leave blank for pure episode numbering
        required: false
        type: number

      episode:
        description: Exact positive episode number to update
        required: true
        type: number

      episode_title:
        description: New title for the selected episode
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-episode-title
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update-title:
    name: Update, validate, and commit episode title
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate workflow inputs
        env:
          SERIES: ${{ inputs.series }}
          SEASON: ${{ inputs.season }}
          EPISODE: ${{ inputs.episode }}
          EPISODE_TITLE: ${{ inputs.episode_title }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SERIES//[[:space:]]/}" ]]; then
            echo "::error::Series is required."
            exit 1
          fi

          if [[ ! "${EPISODE}" =~ ^[0-9]+$ ]] || (( EPISODE < 1 )); then
            echo "::error::Episode must be a positive whole number."
            exit 1
          fi

          if [[ -n "${SEASON}" ]] && {
            [[ ! "${SEASON}" =~ ^[0-9]+$ ]] || (( SEASON < 1 ))
          }; then
            echo "::error::Season must be a positive whole number when provided."
            exit 1
          fi

          if [[ -z "${EPISODE_TITLE//[[:space:]]/}" ]]; then
            echo "::error::Episode title is required."
            exit 1
          fi

      - name: Confirm series exists in canonical metadata
        env:
          SERIES: ${{ inputs.series }}
        shell: bash
        run: |
          set -euo pipefail

          python - "$SERIES" <<'PY'
          import json
          import sys

          def key(value):
              return " ".join(str(value or "").strip().split()).casefold()

          requested = key(sys.argv[1])

          with open("data/series.json", encoding="utf-8") as handle:
              data = json.load(handle)

          series_list = data.get("series", []) if isinstance(data, dict) else data

          matches = [
              item
              for item in series_list
              if isinstance(item, dict)
              and key(item.get("name")) == requested
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "::error::Expected exactly one matching series in "
                  f"data/series.json, found {len(matches)}."
              )

          print(f"Confirmed canonical series: {matches[0]['name']}")
          PY

      - name: Update title through catalogue Python validator
        env:
          SERIES: ${{ inputs.series }}
          SEASON: ${{ inputs.season }}
          EPISODE: ${{ inputs.episode }}
          EPISODE_TITLE: ${{ inputs.episode_title }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --update-episode-title
            --series "$SERIES"
            --episode "$EPISODE"
            --episode-title "$EPISODE_TITLE"
          )

          if [[ -n "${SEASON}" ]]; then
            args+=(--season "$SEASON")
          fi

          python scripts/validate_catalogue.py "${args[@]}"

      - name: Validate complete catalogue
        shell: bash
        run: |
          set -euo pipefail

          python scripts/validate_catalogue.py --validate-only
          python -m json.tool data/videos.json >/dev/null
          python -m json.tool data/series.json >/dev/null
          git diff --check

      - name: Rebase onto latest main and revalidate
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git pull --rebase --autostash origin main

          python scripts/validate_catalogue.py --validate-only
          python -m json.tool data/videos.json >/dev/null
          git diff --check

      - name: Show exact catalogue change
        shell: bash
        run: |
          set -euo pipefail

          git diff -- data/videos.json

          if git diff --quiet -- data/videos.json; then
            echo "::error::No change was made to data/videos.json."
            exit 1
          fi

      - name: Commit and push to main
        env:
          SERIES: ${{ inputs.series }}
          SEASON: ${{ inputs.season }}
          EPISODE: ${{ inputs.episode }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/videos.json

          if git diff --cached --quiet; then
            echo "::error::No staged catalogue changes were produced."
            exit 1
          fi

          if [[ -n "${SEASON}" ]]; then
            commit_label="${SERIES} S$(printf '%02d' "$SEASON")E$(printf '%03d' "$EPISODE")"
          else
            commit_label="${SERIES} E$(printf '%03d' "$EPISODE")"
          fi

          git commit -m "Update episode title for ${commit_label}"
          git push origin HEAD:main

      - name: Confirm clean working tree
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is not clean after commit."
            git status --short
            exit 1
          fi

          echo "Working tree is clean."
