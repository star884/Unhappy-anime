name: Fetch Kiteretsu Episode Titles

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Episodes to update: 1,2,3 or 1-20 or 7,10-15"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-kiteretsu-episode-titles
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  WIKI_URL: "https://ja.wikipedia.org/wiki/%E3%82%AD%E3%83%86%E3%83%AC%E3%83%84%E5%A4%A7%E7%99%BE%E7%A7%91_(%E3%82%A2%E3%83%8B%E3%83%A1)"
  SERIES_NAME: "Kiteretsu Daihyakka"

jobs:
  fetch-titles:
    name: Fetch and validate Kiteretsu episode titles
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input beautifulsoup4

      - name: Fetch and extract regular TV episode titles
        env:
          EPISODES: ${{ inputs.episodes }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          from bs4 import BeautifulSoup, Tag

          URL = os.environ["WIKI_URL"]
          REQUEST = os.environ["EPISODES"]

          def error(message):
              print(f"::error::{message}")
              sys.exit(1)

          def parse_selection(value):
              result = set()

              for item in value.split(","):
                  item = item.strip()

                  if not item:
                      continue

                  if re.fullmatch(r"[1-9][0-9]*", item):
                      result.add(int(item))
                      continue

                  match = re.fullmatch(
                      r"([1-9][0-9]*)-([1-9][0-9]*)",
                      item
                  )

                  if match:
                      start = int(match.group(1))
                      end = int(match.group(2))

                      if end < start:
                          error(f"Invalid range: {item}")

                      if end - start > 100:
                          error(f"Range too large: {item}")

                      result.update(range(start, end + 1))
                      continue

                  error(f"Invalid episode selection: {item}")

              if not result:
                  error("No episodes were supplied.")

              if len(result) > 100:
                  error("Maximum 100 episodes per run.")

              invalid = sorted(n for n in result if n > 331)

              if invalid:
                  error(
                      "Regular TV episodes only support 1-331. "
                      f"Invalid: {invalid}"
                  )

              return sorted(result)

          requested = parse_selection(REQUEST)

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent":
                      "Unhappy-anime Kiteretsu title updater/1.0"
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  html = response.read()
          except Exception as exc:
              error(f"Failed to download Wikipedia page: {exc}")

          soup = BeautifulSoup(html, "html.parser")

          # -----------------------------------------------------------
          # Find the regular "テレビシリーズ" section.
          #
          # We deliberately DO NOT scan the entire page.
          #
          # This prevents:
          #   - 1987 special program
          #   - opening/ending-song tables
          #   - broadcast information
          #   - staff tables
          #   - unrelated tables
          # from being interpreted as regular episodes.
          # -----------------------------------------------------------

          episode_section = None

          for heading in soup.find_all(["h2", "h3", "h4"]):
              text = " ".join(heading.stripped_strings)

              if text == "テレビシリーズ":
                  episode_section = heading
                  break

          if episode_section is None:
              error(
                  "Could not find the regular テレビシリーズ section."
              )

          # Only inspect tables belonging to this section.
          candidate_tables = []

          for element in episode_section.find_all_next():
              if not isinstance(element, Tag):
                  continue

              # Never cross into another major/subsection.
              if element.name in {"h2", "h3", "h4"}:
                  break

              if element.name != "table":
                  continue

              headers = [
                  " ".join(cell.stripped_strings)
                  for cell in element.find_all(
                      ["th", "td"],
                      recursive=False
                  )
              ]

              header_text = " ".join(headers)

              # The regular episode table must contain both concepts.
              if "話数" not in header_text:
                  continue

              if "サブタイトル" not in header_text:
                  continue

              candidate_tables.append(element)

          if not candidate_tables:
              error(
                  "Could not find the regular TV episode table "
                  "containing 話数 and サブタイトル."
              )

          episode_titles = {}

          for table_index, table in enumerate(candidate_tables, 1):
              rows = table.find_all("tr")

              for row in rows:
                  cells = row.find_all(
                      ["th", "td"],
                      recursive=False
                  )

                  if len(cells) < 2:
                      continue

                  number_text = " ".join(
                      cells[0].stripped_strings
                  ).strip()

                  # Ignore table headings such as 話数.
                  match = re.fullmatch(
                      r"([1-9][0-9]*)",
                      number_text
                  )

                  if not match:
                      continue

                  episode = int(match.group(1))

                  if not 1 <= episode <= 331:
                      continue

                  # -------------------------------------------------
                  # IMPORTANT:
                  #
                  # ONLY cells[1] is used.
                  #
                  # This is the サブタイトル column.
                  #
                  # Script, storyboard, direction, animation
                  # director and broadcast date are ignored entirely.
                  # -------------------------------------------------

                  title = " ".join(
                      cells[1].stripped_strings
                  )

                  title = re.sub(
                      r"\s+",
                      " ",
                      title
                  ).strip()

                  if not title:
                      error(
                          f"Episode {episode} has an empty title."
                      )

                  previous = episode_titles.get(episode)

                  if previous is not None and previous != title:
                      error(
                          "Conflicting regular-TV titles for "
                          f"episode {episode}: "
                          f"{previous!r} vs {title!r}"
                      )

                  episode_titles[episode] = title

          missing = [
              episode
              for episode in requested
              if episode not in episode_titles
          ]

          if missing:
              error(
                  "Wikipedia regular-TV titles missing for: "
                  + ", ".join(map(str, missing))
              )

          result = {
              str(episode): episode_titles[episode]
              for episode in requested
          }

          with open(
              "/tmp/kiteretsu_titles.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )
              file.write("\n")

          print()
          print("=== TITLES FOUND ===")

          for episode in requested:
              print(
                  f"E{episode:03d}: "
                  f"{episode_titles[episode]}"
              )

          print()
          PY

      - name: Verify catalogue matches
        env:
          EPISODES: ${{ inputs.episodes }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys

          def parse_selection(value):
              result = set()

              for item in value.split(","):
                  item = item.strip()

                  if re.fullmatch(r"[1-9][0-9]*", item):
                      result.add(int(item))
                      continue

                  match = re.fullmatch(
                      r"([1-9][0-9]*)-([1-9][0-9]*)",
                      item
                  )

                  if match:
                      result.update(
                          range(
                              int(match.group(1)),
                              int(match.group(2)) + 1
                          )
                      )
                      continue

                  raise SystemExit(
                      f"Invalid episode selection: {item}"
                  )

              return sorted(result)

          requested = parse_selection(
              os.environ["EPISODES"]
          )

          with open(
              "data/videos.json",
              encoding="utf-8"
          ) as file:
              videos = json.load(file)

          matches = {}

          for record in videos:
              if (
                  record.get("series") == "Kiteretsu Daihyakka"
                  and record.get("type", "episode") == "episode"
                  and record.get("category", "main") == "main"
              ):
                  episode = record.get("episode")

                  if isinstance(episode, int):
                      matches.setdefault(
                          episode,
                          []
                      ).append(record)

          missing = []
          duplicate = []

          for episode in requested:
              found = matches.get(episode, [])

              if len(found) == 0:
                  missing.append(episode)

              elif len(found) > 1:
                  duplicate.append(episode)

          if missing:
              print(
                  "::error::Catalogue episodes missing: "
                  + ", ".join(map(str, missing))
              )
              sys.exit(1)

          if duplicate:
              print(
                  "::error::Duplicate catalogue episodes: "
                  + ", ".join(map(str, duplicate))
              )
              sys.exit(1)

          print(
              f"Verified {len(requested)} exact catalogue episodes."
          )
          PY

      - name: Apply titles using existing Python validator
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import subprocess
          import sys

          with open(
              "/tmp/kiteretsu_titles.json",
              encoding="utf-8"
          ) as file:
              titles = json.load(file)

          for episode_text, title in titles.items():
              episode = int(episode_text)

              command = [
                  "python",
                  "scripts/validate_catalogue.py",
                  "--update-episode-title",
                  "--series",
                  "Kiteretsu Daihyakka",
                  "--episode",
                  str(episode),
                  "--episode-title",
                  title,
              ]

              print(
                  f"Updating episode {episode}: {title}"
              )

              result = subprocess.run(command)

              if result.returncode != 0:
                  print(
                      "::error::Validator failed for "
                      f"episode {episode}"
                  )
                  sys.exit(result.returncode)

          PY

      - name: Validate entire repository
        run: |
          set -euo pipefail

          python scripts/validate_catalogue.py --validate-only

          python -m py_compile \
            scripts/validate_catalogue.py \
            scripts/generate_thumbnails.py

          python -m json.tool data/videos.json >/dev/null
          python -m json.tool data/series.json >/dev/null

          git diff --check

      - name: Show changes
        run: |
          set -euo pipefail

          if git diff --quiet -- data/videos.json; then
            echo "::error::No title changes were produced."
            echo "The requested titles may already be present."
            exit 1
          fi

          git diff -- data/videos.json

      - name: Commit changes
        env:
          EPISODES: ${{ inputs.episodes }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/videos.json

          if git diff --cached --quiet; then
            echo "::error::Nothing to commit."
            exit 1
          fi

          git commit \
            -m "Update Kiteretsu episode titles (${EPISODES})"

      - name: Push to main
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Confirm clean working tree
        run: |
          set -euo pipefail
          git status --short
