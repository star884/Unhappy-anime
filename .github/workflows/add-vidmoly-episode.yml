name: Add VidMoly media

on:
  workflow_dispatch:
    inputs:
      series: { description: "Exact series name from data/series.json", required: true, type: string }
      type: { description: "episode, movie, ova, ona, extra, or other", required: false, default: episode, type: string }
      category: { description: "main, special, movie, ova, ona, extra, or other", required: false, type: string }
      season: { description: "Season number for seasonal episodes", required: false, type: number }
      episode: { description: "Episode number or AUTO", required: false, default: AUTO, type: string }
      episode_title: { description: "Episode title", required: false, type: string }
      special_date: { description: "Date special in YYYY-MM-DD", required: false, type: string }
      title: { description: "Display title", required: false, type: string }
      quality: { description: "Quality", required: false, default: 1080p, type: string }
      source_filename: { description: "Original source filename", required: false, type: string }
      vidmoly_url: { description: "VidMoly embed URL", required: true, type: string }

permissions:
  contents: write

concurrency:
  group: add-vidmoly-media
  cancel-in-progress: false

jobs:
  add-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Add and validate media
        env:
          SERIES: ${{ inputs.series }}
          TYPE: ${{ inputs.type }}
          CATEGORY: ${{ inputs.category }}
          SEASON: ${{ inputs.season }}
          EPISODE: ${{ inputs.episode }}
          EPISODE_TITLE: ${{ inputs.episode_title }}
          SPECIAL_DATE: ${{ inputs.special_date }}
          TITLE: ${{ inputs.title }}
          QUALITY: ${{ inputs.quality }}
          SOURCE_FILENAME: ${{ inputs.source_filename }}
          VIDMOLY_URL: ${{ inputs.vidmoly_url }}
        run: |
          set -euo pipefail
          args=(--series "$SERIES" --type "$TYPE" --episode "$EPISODE" --episode-title "$EPISODE_TITLE" --special-date "$SPECIAL_DATE" --title "$TITLE" --quality "$QUALITY" --source-filename "$SOURCE_FILENAME" --vidmoly-url "$VIDMOLY_URL")
          [ -n "$CATEGORY" ] && args+=(--category "$CATEGORY")
          [ -n "$SEASON" ] && args+=(--season "$SEASON")
          python scripts/validate_catalogue.py "${args[@]}"
          python scripts/validate_catalogue.py --validate-only
          git diff --check
      - name: Commit and push
        env: { SERIES: ${{ inputs.series }} }
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet && { echo "No changes detected"; exit 1; }
          git commit -m "Add ${SERIES} media"
          git push origin HEAD:main
      - name: Validate thumbnail workflow compatibility
        run: python -m py_compile scripts/generate_thumbnails.py
