name: Add Vidmoly Episode

on:
  workflow_dispatch:
    inputs:
      vidmoly_url:
        description: "Vidmoly embed URL"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: add-vidmoly-episode
  cancel-in-progress: false

jobs:
  add-episode:
    name: Add Episode to videos.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add episode
        env:
          VIDMOLY_URL: ${{ inputs.vidmoly_url }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlparse


          FILE = Path("data/videos.json")
          INPUT_URL = os.environ.get("VIDMOLY_URL", "").strip()


          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)


          # ============================================================
          # 1. Validate supplied Vidmoly URL
          # ============================================================

          if not INPUT_URL:
              fail("No Vidmoly URL was supplied.")


          parsed = urlparse(INPUT_URL)

          allowed_hosts = {
              "vidmoly.org",
              "www.vidmoly.org",
              "vidmoly.me",
              "www.vidmoly.me",
          }

          host = parsed.netloc.lower().split("@")[-1].split(":")[0]

          if host not in allowed_hosts:
              fail(
                  "Invalid host. Please provide a Vidmoly URL."
              )


          if not parsed.path.lower().startswith("/embed-"):
              fail(
                  "Invalid Vidmoly URL. Expected an embed URL "
                  "such as https://vidmoly.org/embed-example.html"
              )


          if not parsed.path.lower().endswith(".html"):
              fail(
                  "Invalid Vidmoly URL. The embed URL must end with .html."
              )


          # Strip query parameters and fragments.
          embed_url = (
              f"https://{host}{parsed.path}"
          )


          print(f"Input URL: {embed_url}")


          # ============================================================
          # 2. Read videos.json
          # ============================================================

          if not FILE.exists():
              fail(f"{FILE} was not found.")


          try:
              with FILE.open("r", encoding="utf-8") as file:
                  videos = json.load(file)
          except json.JSONDecodeError as exc:
              fail(f"videos.json contains invalid JSON: {exc}")
          except OSError as exc:
              fail(f"Could not read videos.json: {exc}")


          if not isinstance(videos, list):
              fail(
                  "data/videos.json must contain a top-level JSON array."
              )


          if not videos:
              fail(
                  "videos.json is empty. At least one existing episode "
                  "is required so the workflow can determine the series."
              )


          # ============================================================
          # 3. Validate existing entries
          # ============================================================

          required_fields = {
              "id",
              "title",
              "series",
              "episode",
              "year",
              "genres",
              "quality",
              "description",
              "embed",
              "thumbnail",
          }


          episode_entries = []


          for index, video in enumerate(videos):

              if not isinstance(video, dict):
                  fail(
                      f"Entry {index} in videos.json is not an object."
                  )


              missing = required_fields - set(video.keys())

              if missing:
                  fail(
                      f"Entry {index} is missing required fields: "
                      + ", ".join(sorted(missing))
                  )


              try:
                  episode = int(video["episode"])
              except (TypeError, ValueError):
                  fail(
                      f"Entry {index} has an invalid episode number: "
                      f"{video.get('episode')!r}"
                  )


              if episode < 0:
                  fail(
                      f"Entry {index} has a negative episode number."
                  )


              if not isinstance(video["genres"], list):
                  fail(
                      f"Entry {index} has an invalid genres field."
                  )


              episode_entries.append(
                  (episode, index, video)
              )


          # ============================================================
          # 4. Normalise URLs for duplicate detection
          # ============================================================

          def normalise_url(value):
              value = str(value or "").strip()

              if not value:
                  return ""

              try:
                  url = urlparse(value)

                  if not url.netloc:
                      return value.lower()

                  return (
                      f"{url.scheme.lower()}://"
                      f"{url.netloc.lower()}"
                      f"{url.path}"
                  )

              except Exception:
                  return value.lower()


          supplied_normalised = normalise_url(embed_url)


          for _, index, video in episode_entries:
              existing_url = normalise_url(
                  video.get("embed", "")
              )

              if (
                  existing_url
                  and existing_url == supplied_normalised
              ):
                  fail(
                      "This Vidmoly URL already exists in "
                      f"data/videos.json at entry {index}. "
                      "Nothing was changed."
                  )


          # ============================================================
          # 5. Find the latest episode
          # ============================================================

          latest_episode, latest_index, template = max(
              episode_entries,
              key=lambda item: (item[0], item[1])
          )


          new_episode = latest_episode + 1


          series = str(template["series"]).strip()
          year = template["year"]
          genres = list(template["genres"])
          quality = str(template["quality"]).strip()


          if not series:
              fail("The latest episode has an empty series name.")


          # ============================================================
          # 6. Generate ID
          # ============================================================

          template_id = str(template["id"]).strip()


          id_match = re.fullmatch(
              r"(.+)-(\d+)",
              template_id
          )


          if id_match:
              prefix = id_match.group(1)
          else:
              prefix = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  series.lower()
              ).strip("-")


          if not prefix:
              fail(
                  "Could not determine an ID prefix from the "
                  "existing episode."
              )


          new_id = f"{prefix}-{new_episode:03d}"


          existing_ids = {
              str(video.get("id")).strip()
              for video in videos
              if video.get("id") is not None
          }


          if new_id in existing_ids:
              fail(
                  f"Generated ID '{new_id}' already exists. "
                  "No changes were made."
              )


          # ============================================================
          # 7. Generate metadata
          # ============================================================

          title = (
              f"{series} - Episode "
              f"{new_episode:03d}"
          )


          description = (
              f"{series} episode "
              f"{new_episode:03d}."
          )


          # IMPORTANT:
          # Thumbnail is intentionally NOT generated here.
          #
          # The separate thumbnail workflow is responsible for
          # filling the thumbnail field later.
          #
          # We preserve the existing videos.json schema by creating
          # the field with an empty value.
          thumbnail = ""


          new_video = {
              "id": new_id,
              "title": title,
              "series": series,
              "episode": new_episode,
              "year": year,
              "genres": genres,
              "quality": quality,
              "description": description,
              "embed": embed_url,
              "thumbnail": thumbnail,
          }


          # ============================================================
          # 8. Safety checks before modifying the file
          # ============================================================

          if new_video["episode"] != latest_episode + 1:
              fail(
                  "Internal validation failed: episode numbering."
              )


          if new_video["id"] in existing_ids:
              fail(
                  "Internal validation failed: duplicate ID."
              )


          if normalise_url(new_video["embed"]) in {
              normalise_url(
                  video.get("embed", "")
              )
              for video in videos
          }:
              fail(
                  "Internal validation failed: duplicate embed URL."
              )


          if new_video["thumbnail"] != "":
              fail(
                  "Internal validation failed: thumbnail must remain empty."
              )


          expected_keys = [
              "id",
              "title",
              "series",
              "episode",
              "year",
              "genres",
              "quality",
              "description",
              "embed",
              "thumbnail",
          ]


          if list(new_video.keys()) != expected_keys:
              fail(
                  "Internal validation failed: field order changed."
              )


          # ============================================================
          # 9. Append the episode
          # ============================================================

          updated_videos = videos + [new_video]


          # ============================================================
          # 10. Validate the complete resulting catalogue
          # ============================================================

          if not isinstance(updated_videos, list):
              fail(
                  "Internal validation failed: catalogue is not a list."
              )


          for index, video in enumerate(updated_videos):

              if not isinstance(video, dict):
                  fail(
                      f"Final validation failed at entry {index}."
                  )


              missing = required_fields - set(video.keys())

              if missing:
                  fail(
                      f"Final validation failed at entry {index}: "
                      f"missing {sorted(missing)}"
                  )


          if updated_videos[-1] != new_video:
              fail(
                  "Final validation failed: new episode mismatch."
              )


          # ============================================================
          # 11. Write the file
          # ============================================================

          try:
              with FILE.open(
                  "w",
                  encoding="utf-8",
                  newline="\n",
              ) as file:
                  json.dump(
                      updated_videos,
                      file,
                      ensure_ascii=False,
                      indent=2,
                  )
                  file.write("\n")
          except OSError as exc:
              fail(
                  f"Could not write {FILE}: {exc}"
              )


          # ============================================================
          # 12. Re-read and verify the actual written file
          # ============================================================

          try:
              with FILE.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  verification = json.load(file)
          except Exception as exc:
              fail(
                  f"Could not re-read the generated JSON: {exc}"
              )


          if verification != updated_videos:
              fail(
                  "Post-write verification failed. "
                  "The generated file does not match the expected data."
              )


          # Explicitly verify thumbnail remains empty.
          if verification[-1].get("thumbnail") != "":
              fail(
                  "Post-write verification failed: thumbnail was populated."
              )


          print()
          print("==============================================")
          print("SUCCESS")
          print("==============================================")
          print(f"Series:      {series}")
          print(f"Episode:     {new_episode:03d}")
          print(f"ID:          {new_id}")
          print(f"Title:       {title}")
          print(f"Year:        {year}")
          print(f"Quality:     {quality}")
          print(f"Embed:       {embed_url}")
          print("Thumbnail:   EMPTY")
          print("JSON:        VALID")
          print("==============================================")
          print()
          PY

      - name: Validate JSON and Git diff
        run: |
          python -m json.tool data/videos.json > /dev/null
          git diff --check
          git diff -- data/videos.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/videos.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 1
          fi

          git commit -m "Add next Vidmoly episode"

      - name: Push changes
        run: |
          git push origin HEAD:main
