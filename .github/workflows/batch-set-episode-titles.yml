name: Batch Set Episode Titles from CSV

on:
  workflow_dispatch:
    inputs:
      csv_file:
        description: Path to the CSV file
        required: true
        default: data/episode_titles.csv
        type: string

      series:
        description: Exact series name from data/series.json
        required: true
        default: Kiteretsu Daihyakka
        type: string

  push:
    paths:
      - data/episode_titles.csv

permissions:
  contents: write

concurrency:
  group: batch-set-episode-titles
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    name: Batch update episode titles
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Process CSV
        id: process
        env:
          CSV_FILE: ${{ inputs.csv_file || 'data/episode_titles.csv' }}
          SERIES: ${{ inputs.series || 'Kiteretsu Daihyakka' }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          CSV_FILE = Path(os.environ["CSV_FILE"])
          SERIES = os.environ["SERIES"].strip()

          VIDEOS_FILE = Path("data/videos.json")
          SERIES_FILE = Path("data/series.json")
          VALIDATOR = Path("scripts/validate_catalogue.py")

          def error(message):
              print(f"::error::{message}")
              raise SystemExit(1)

          def normalise(value):
              return " ".join(str(value or "").split()).casefold()

          def run_command(command):
              return subprocess.run(
                  command,
                  check=False,
                  text=True,
              )

          # ----------------------------------------------------------
          # Required files
          # ----------------------------------------------------------

          if not SERIES:
              error("Series name cannot be empty")

          if not CSV_FILE.is_file():
              error(f"CSV file not found: {CSV_FILE}")

          if not VIDEOS_FILE.is_file():
              error("data/videos.json was not found")

          if not SERIES_FILE.is_file():
              error("data/series.json was not found")

          if not VALIDATOR.is_file():
              error("scripts/validate_catalogue.py was not found")

          # ----------------------------------------------------------
          # Validate series
          # ----------------------------------------------------------

          try:
              series_data = json.loads(
                  SERIES_FILE.read_text(encoding="utf-8")
              )
          except (OSError, json.JSONDecodeError) as exc:
              error(f"Unable to read data/series.json: {exc}")

          if isinstance(series_data, dict):
              series_list = series_data.get("series", [])
          elif isinstance(series_data, list):
              series_list = series_data
          else:
              error("data/series.json must contain an object or array")

          matching_series = [
              item
              for item in series_list
              if isinstance(item, dict)
              and normalise(item.get("name")) == normalise(SERIES)
          ]

          if len(matching_series) != 1:
              error(
                  f"Expected exactly one series named {SERIES!r}; "
                  f"found {len(matching_series)}"
              )

          canonical_series = str(
              matching_series[0].get("name") or ""
          ).strip()

          if not canonical_series:
              error("Matched series has an empty name")

          # ----------------------------------------------------------
          # Read CSV
          # ----------------------------------------------------------

          try:
              with CSV_FILE.open(
                  "r",
                  encoding="utf-8-sig",
                  newline=""
              ) as handle:
                  reader = csv.DictReader(handle)

                  if reader.fieldnames is None:
                      error("CSV has no header")

                  headers = [
                      str(value).strip()
                      if value is not None
                      else ""
                      for value in reader.fieldnames
                  ]

                  if headers != ["episode_number", "title"]:
                      error(
                          "CSV header must be exactly: "
                          "episode_number,title"
                      )

                  rows = list(reader)

          except UnicodeDecodeError as exc:
              error(f"CSV must be UTF-8 encoded: {exc}")
          except csv.Error as exc:
              error(f"CSV parsing failed: {exc}")
          except OSError as exc:
              error(f"Unable to read CSV: {exc}")

          if not rows:
              error("CSV contains no episode rows")

          # ----------------------------------------------------------
          # Validate every CSV row before touching videos.json
          # ----------------------------------------------------------

          csv_titles = {}
          csv_errors = []

          for line_number, row in enumerate(rows, start=2):
              episode_raw = str(
                  row.get("episode_number") or ""
              ).strip()

              title = str(
                  row.get("title") or ""
              ).strip()

              if not re.fullmatch(r"[1-9][0-9]*", episode_raw):
                  csv_errors.append(
                      f"line {line_number}: invalid episode number "
                      f"{episode_raw!r}"
                  )
                  continue

              if not title:
                  csv_errors.append(
                      f"line {line_number}: episode title is empty"
                  )
                  continue

              episode = int(episode_raw)

              if episode in csv_titles:
                  csv_errors.append(
                      f"line {line_number}: duplicate episode "
                      f"{episode}"
                  )
                  continue

              csv_titles[episode] = title

          if csv_errors:
              for message in csv_errors:
                  print(f"::error::{message}")
              raise SystemExit(1)

          print(
              f"CSV contains {len(csv_titles)} valid episode titles "
              f"for {canonical_series}."
          )

          # ----------------------------------------------------------
          # Load videos.json
          # ----------------------------------------------------------

          try:
              original_videos = json.loads(
                  VIDEOS_FILE.read_text(encoding="utf-8")
              )
          except (OSError, json.JSONDecodeError) as exc:
              error(f"Unable to read data/videos.json: {exc}")

          if not isinstance(original_videos, list):
              error("data/videos.json must contain an array")

          # ----------------------------------------------------------
          # Build index of pure/non-seasonal regular episodes.
          #
          # Missing type -> episode.
          # Missing category -> main.
          #
          # Specials and seasonal records are deliberately excluded.
          # ----------------------------------------------------------

          episode_records = {}

          for index, record in enumerate(original_videos):

              if not isinstance(record, dict):
                  error(
                      f"videos.json entry {index} is not an object"
                  )

              if normalise(record.get("series")) != normalise(
                  canonical_series
              ):
                  continue

              record_type = str(
                  record.get("type") or "episode"
              ).strip().casefold()

              if record_type != "episode":
                  continue

              record_category = str(
                  record.get("category") or "main"
              ).strip().casefold()

              if record_category != "main":
                  continue

              if record.get("season") not in (None, ""):
                  continue

              episode = record.get("episode")

              if (
                  isinstance(episode, bool)
                  or not isinstance(episode, int)
                  or episode < 1
              ):
                  continue

              episode_records.setdefault(
                  episode,
                  []
              ).append(index)

          # ----------------------------------------------------------
          # Every CSV row must have exactly one matching episode.
          # No changes have happened yet.
          # ----------------------------------------------------------

          missing = []
          ambiguous = []

          for episode in sorted(csv_titles):

              matches = episode_records.get(episode, [])

              if not matches:
                  missing.append(episode)

              elif len(matches) != 1:
                  ambiguous.append(
                      (episode, matches)
                  )

          if missing:
              error(
                  "These CSV episodes do not exist in videos.json: "
                  + ", ".join(map(str, missing))
              )

          if ambiguous:
              for episode, indexes in ambiguous:
                  print(
                      "::error::Episode "
                      f"{episode} has multiple matching records: "
                      + ", ".join(map(str, indexes))
                  )
              raise SystemExit(1)

          # ----------------------------------------------------------
          # Preserve the original file for a final safety comparison.
          # ----------------------------------------------------------

          original_text = VIDEOS_FILE.read_text(
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Process every CSV title.
          #
          # This uses the same existing validator used by
          # set-episode-title.yml.
          #
          # There is still only ONE GitHub Actions run and ONE commit.
          # ----------------------------------------------------------

          changed = []
          unchanged = []

          for episode in sorted(csv_titles):

              index = episode_records[episode][0]
              current_catalogue = json.loads(
                  VIDEOS_FILE.read_text(encoding="utf-8")
              )

              if not isinstance(current_catalogue, list):
                  error(
                      "data/videos.json became invalid during processing"
                  )

              current_record = current_catalogue[index]

              current_title = str(
                  current_record.get("episode_title") or ""
              ).strip()

              new_title = csv_titles[episode]

              if current_title == new_title:
                  unchanged.append(episode)
                  continue

              command = [
                  sys.executable,
                  str(VALIDATOR),
                  "--update-episode-title",
                  "--series",
                  canonical_series,
                  "--episode",
                  str(episode),
                  "--episode-title",
                  new_title,
              ]

              print(
                  f"Setting E{episode:03d}: {new_title}"
              )

              result = run_command(command)

              if result.returncode != 0:
                  error(
                      "Existing catalogue validator failed while "
                      f"updating episode {episode}"
                  )

              changed.append(episode)

          # ----------------------------------------------------------
          # Make sure the catalogue still exists and is valid JSON.
          # ----------------------------------------------------------

          try:
              final_videos = json.loads(
                  VIDEOS_FILE.read_text(encoding="utf-8")
              )
          except (OSError, json.JSONDecodeError) as exc:
              error(
                  f"data/videos.json is invalid after batch update: {exc}"
              )

          if not isinstance(final_videos, list):
              error("data/videos.json must remain an array")

          # ----------------------------------------------------------
          # Report result
          # ----------------------------------------------------------

          print("")
          print("========================================")
          print("BATCH UPDATE")
          print("========================================")
          print(f"Series:       {canonical_series}")
          print(f"CSV rows:     {len(csv_titles)}")
          print(f"Changed:      {len(changed)}")
          print(f"Unchanged:    {len(unchanged)}")

          if changed:
              print(
                  "Changed episodes: "
                  + ", ".join(map(str, changed))
              )

          # ----------------------------------------------------------
          # Safety check:
          # ONLY data/videos.json is allowed to be modified.
          #
          # Do NOT parse `git status --short`; use Git's machine-readable
          # name lists so whitespace/status columns cannot corrupt paths.
          # ----------------------------------------------------------

          changed_paths_result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          untracked_paths_result = subprocess.run(
              [
                  "git",
                  "ls-files",
                  "--others",
                  "--exclude-standard",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed_paths = {
              line.strip()
              for line in changed_paths_result.stdout.splitlines()
              if line.strip()
          }

          untracked_paths = {
              line.strip()
              for line in untracked_paths_result.stdout.splitlines()
              if line.strip()
          }

          all_modified_paths = changed_paths | untracked_paths

          unexpected = sorted(
              path
              for path in all_modified_paths
              if path != "data/videos.json"
          )

          if unexpected:
              error(
                  "Unexpected files changed: "
                  + ", ".join(unexpected)
              )

          # ----------------------------------------------------------
          # Determine whether a commit is actually required.
          # ----------------------------------------------------------

          final_diff = subprocess.run(
              [
                  "git",
                  "diff",
                  "--quiet",
                  "--",
                  "data/videos.json",
              ],
              check=False,
          )

          needs_commit = final_diff.returncode != 0

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  "changed="
                  + ("true" if needs_commit else "false")
                  + "\n"
              )

          if not needs_commit:
              print("No catalogue changes are required.")

          # Make sure the original file was actually read successfully.
          if not original_text:
              print(
                  "::notice::Original data/videos.json was empty "
                  "before processing"
              )
          PY

      - name: Run existing catalogue validator
        run: |
          set -euo pipefail

          python scripts/validate_catalogue.py --validate-only

      - name: Run repository checks
        run: |
          set -euo pipefail

          python -m compileall -q scripts

          python -m json.tool data/videos.json >/dev/null
          python -m json.tool data/series.json >/dev/null

          git diff --check

      - name: Show changes
        if: steps.process.outputs.changed == 'true'
        run: |
          set -euo pipefail

          echo "Changed files:"
          git status --short

          echo
          echo "Diff statistics:"
          git diff --stat -- data/videos.json

          echo
          echo "Catalogue diff:"
          git diff -- data/videos.json

      - name: Commit one batch update
        if: steps.process.outputs.changed == 'true'
        env:
          SERIES: ${{ inputs.series || 'Kiteretsu Daihyakka' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/videos.json

          if git diff --cached --quiet; then
            echo "::error::Expected changes but nothing was staged"
            exit 1
          fi

          git commit -m "Batch update episode titles: ${SERIES}"

          git push origin HEAD:main

      - name: Confirm final state
        run: |
          set -euo pipefail

          echo "Final repository status:"
          git status --short

          echo
          echo "Batch episode-title update completed successfully."
