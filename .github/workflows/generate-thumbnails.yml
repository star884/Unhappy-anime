name: Generate VidMoly thumbnails

on:
  push:
    paths:
      - "data/videos.json"
      - "scripts/generate_thumbnails.py"

  workflow_dispatch:
    inputs:
      force:
        description: "Refresh all existing VidMoly thumbnails"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: vidmoly-thumbnail-generator
  cancel-in-progress: false

jobs:
  generate:
    # Prevent the workflow from reacting to the commit
    # created by this workflow itself.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message != 'ci: update VidMoly thumbnails'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Generate VidMoly thumbnails
        run: |
          python scripts/generate_thumbnails.py \
            --catalogue data/videos.json \
            --force

      - name: Validate videos.json
        run: |
          python -m json.tool data/videos.json > /dev/null
          echo "videos.json is valid JSON."

      - name: Show catalogue changes
        run: |
          git status --short
          git diff -- data/videos.json

      - name: Commit thumbnail changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/videos.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "ci: update VidMoly thumbnails"
          git push
