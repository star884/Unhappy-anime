<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stream media content directly from VidMoly provider library.">
  <title>StreamVerse - VidMoly Media Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="brand-logo" id="logoLink">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>StreamVerse</span>
      </a>
      
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="searchInput" placeholder="Search title, series, genre, quality..." aria-label="Search media catalogue">
      </div>

      <nav class="nav-actions">
        <button class="nav-btn" id="navHomeBtn" aria-label="Go to Home">Home</button>
        <button class="nav-btn" id="navFavsBtn" aria-label="View Favorites">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          Favorites (<span id="favCount">0</span>)
        </button>
        <button class="nav-btn" id="navHistoryBtn" aria-label="View Watch History">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="12 8 12 12 14 14"></polyline>
            <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"></path>
          </svg>
          History
        </button>
      </nav>
    </div>
  </header>

  <main>
    <!-- Notification Banner -->
    <div id="notificationArea" class="notification-area" aria-live="polite"></div>

    <!-- Hero Section -->
    <section id="heroSection" class="hero-section" aria-label="Featured Content">
      <div class="hero-backdrop" id="heroBackdrop"></div>
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <span class="hero-badge" id="heroBadge">Featured</span>
        <h1 class="hero-title" id="heroTitle">Loading...</h1>
        <p class="hero-meta" id="heroMeta"></p>
        <p class="hero-description" id="heroDescription"></p>
        <div class="hero-controls">
          <button class="btn btn-primary" id="heroWatchBtn" aria-label="Watch Featured Media">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            Watch Now
          </button>
          <button class="btn btn-secondary" id="heroDetailsBtn" aria-label="View Details of Featured Media">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            More Info
          </button>
        </div>
      </div>
    </section>

    <!-- Controls Bar (Filter & Sort) -->
    <section class="controls-bar" aria-label="Catalogue Filtering and Sorting">
      <div class="filter-group">
        <label for="seriesFilter" class="filter-label">Series:</label>
        <select id="seriesFilter" class="filter-select" aria-label="Filter by series">
          <option value="ALL">All Series</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="genreFilter" class="filter-label">Genre:</label>
        <select id="genreFilter" class="filter-select" aria-label="Filter by genre">
          <option value="ALL">All Genres</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="qualityFilter" class="filter-label">Quality:</label>
        <select id="qualityFilter" class="filter-select" aria-label="Filter by quality">
          <option value="ALL">All Qualities</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="sortBy" class="filter-label">Sort by:</label>
        <select id="sortBy" class="filter-select" aria-label="Sort videos">
          <option value="default">Catalogue Order</option>
          <option value="title">Title (A-Z)</option>
          <option value="episode">Episode Number</option>
          <option value="quality">Quality</option>
        </select>
      </div>
      
      <button id="resetFiltersBtn" class="btn btn-small" aria-label="Reset all filters">Reset</button>
    </section>

    <!-- Library Container -->
    <section class="library-section" aria-label="Media Library Catalogue">
      <div class="section-header">
        <h2 id="sectionTitle">Library Catalogue</h2>
        <span class="count-badge" id="resultCount">0 items</span>
      </div>

      <div id="videoGrid" class="video-grid" role="region" aria-live="polite">
        <!-- Rendered Card Items -->
      </div>
    </section>
  </main>

  <!-- Player Modal -->
  <div id="playerModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="playerTitle" hidden>
    <div class="modal-overlay" id="playerOverlay"></div>
    <div class="modal-container player-modal-container">
      <div class="modal-header">
        <h3 id="playerTitle" class="modal-title">Watch Video</h3>
        <button class="close-btn" id="closePlayerBtn" aria-label="Close video player">&times;</button>
      </div>
      <div class="modal-body player-body">
        <div class="iframe-container" id="iframeContainer">
          <div class="player-loader" id="playerLoader">
            <div class="spinner"></div>
            <p>Connecting to VidMoly...</p>
          </div>
          <!-- iframe injected lazily via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Details Modal -->
  <div id="detailsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detailsTitle" hidden>
    <div class="modal-overlay" id="detailsOverlay"></div>
    <div class="modal-container details-modal-container">
      <div class="modal-header">
        <h3 id="detailsTitle" class="modal-title">Item Details</h3>
        <button class="close-btn" id="closeDetailsBtn" aria-label="Close details">&times;</button>
      </div>
      <div class="modal-body details-body" id="detailsBody">
        <!-- Content populated via JS -->
      </div>
    </div>
  </div>

  <!-- History Drawer / Modal -->
  <div id="historyModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="historyTitle" hidden>
    <div class="modal-overlay" id="historyOverlay"></div>
    <div class="modal-container history-modal-container">
      <div class="modal-header">
        <h3 id="historyTitle" class="modal-title">Watch History</h3>
        <button class="close-btn" id="closeHistoryBtn" aria-label="Close history">&times;</button>
      </div>
      <div class="modal-body">
        <div id="historyList" class="history-list"></div>
      </div>
      <div class="modal-footer">
        <button id="clearHistoryBtn" class="btn btn-danger">Clear History</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>StreamVerse Media Library &copy; 2026. Powered by VidMoly Embedded Player.</p>
  </footer>

  <script src="app.js"></script>
</body>
  </html>
